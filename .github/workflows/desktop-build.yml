name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            os: macos-latest
            args: --mac --x64
          - name: macOS-arm64
            os: macos-latest
            args: --mac --arm64
          - name: Windows-x64
            os: windows-latest
            args: --win --x64
          - name: Windows-arm64
            os: windows-latest
            args: --win --arm64
          - name: Linux-x64
            os: ubuntu-latest
            args: --linux --x64
          - name: Linux-arm64
            os: ubuntu-latest
            args: --linux --arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run build

      - name: Create desktop package
        working-directory: app
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lyzer-${{ matrix.name }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: find artifacts -type f -print0 | xargs -0 gh release create "${GITHUB_REF_NAME}" --title "LYZER ${GITHUB_REF_NAME}" --generate-notes
